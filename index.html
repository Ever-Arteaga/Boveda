<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bóveda</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-hover: #f0f2f8;
      --surface-selected: #eaeeff;
      --border: #e2e5ee;
      --ink: #1c2033;
      --ink-dim: #6b7284;
      --ink-faint: #a2a8b8;
      --accent: #3d5afe;
      --accent-dim: #e8ecff;
      --accent-ink: #2a3ecf;
      --folder: #f5a623;
      --danger: #e0503a;
      --danger-dim: #fdece8;
      --ok: #1fa671;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(28, 32, 51, 0.06);
      --shadow-md: 0 6px 20px rgba(28, 32, 51, 0.10);
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: var(--sans);
    }

    input {
      font-family: var(--sans);
    }

    /* ============ AUTENTICACIÓN ============ */
    #vista-auth {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-caja {
      width: 100%;
      max-width: 400px;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .auth-logo .marca {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #7c5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .auth-logo .marca svg {
      width: 18px;
      height: 18px;
    }

    .auth-logo span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-dim);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button.activo {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--ink-dim);
      margin: 14px 0 6px;
    }

    input[type=text],
    input[type=password],
    input[type=email] {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--ink);
      font-size: 0.9rem;
      padding: 10px 12px;
      border-radius: 9px;
      outline: none;
      transition: border-color .15s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    .fila>div {
      flex: 1;
    }

    button.principal {
      margin-top: 20px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: background .15s;
    }

    button.principal:hover {
      background: var(--accent-ink);
    }

    .mensaje {
      font-size: 0.78rem;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }

    .mensaje.ok {
      display: block;
      background: #e6f7ef;
      color: var(--ok);
    }

    .mensaje.error {
      display: block;
      background: var(--danger-dim);
      color: var(--danger);
    }

    .codigo-caja {
      margin-top: 14px;
      padding: 12px;
      background: var(--accent-dim);
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--accent-ink);
      text-align: center;
      font-weight: 600;
    }

    /* ============ APP (layout tipo Drive) ============ */
    #vista-app {
      display: none;
      min-height: 100vh;
      grid-template-columns: 240px 1fr;
    }

    #vista-app.activo {
      display: grid;
    }

    /* --- Sidebar --- */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
    }

    .sidebar .logo .marca {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7c5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar .logo .marca svg {
      width: 16px;
      height: 16px;
    }

    .sidebar .logo span {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .btn-nuevo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.86rem;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
      position: relative;
    }

    .btn-nuevo:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .menu-nuevo {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      z-index: 30;
    }

    .menu-nuevo.abierto {
      display: block;
    }

    .menu-nuevo button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 11px 14px;
      font-size: 0.84rem;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-nuevo button:hover {
      background: var(--surface-hover);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      color: var(--ink-dim);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.activo {
      background: var(--accent-dim);
      color: var(--accent-ink);
    }

    .nav-item:hover:not(.activo) {
      background: var(--surface-hover);
    }

    .uso-almacenamiento {
      margin-top: 18px;
      padding: 12px 10px;
    }

    .uso-almacenamiento .barra-uso {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .uso-almacenamiento .barra-uso .relleno {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .3s;
    }

    .uso-almacenamiento .barra-uso .relleno.alerta {
      background: var(--danger);
    }

    .uso-almacenamiento .texto-uso {
      font-size: 0.72rem;
      color: var(--ink-dim);
      font-weight: 600;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .cuenta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 9px;
      cursor: pointer;
    }

    .cuenta:hover {
      background: var(--surface-hover);
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .cuenta .email {
      font-size: 0.78rem;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .cuenta button {
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 2px;
    }

    .cuenta button:hover {
      color: var(--danger);
    }

    /* --- Zona principal --- */
    .main {
      padding: 20px 32px 60px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .buscador-wrap {
      flex: 1;
      position: relative;
      max-width: 480px;
    }

    .buscador-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--ink-faint);
    }

    .buscador-wrap input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.86rem;
    }

    .buscador-wrap input:focus {
      border-color: var(--accent);
      outline: none;
    }

    .toggle-vista {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      margin-left: auto;
    }

    .toggle-vista button {
      background: none;
      border: none;
      padding: 7px 9px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--ink-faint);
      display: flex;
    }

    .toggle-vista button.activo {
      background: var(--accent-dim);
      color: var(--accent-ink);
    }

    .toggle-vista svg {
      width: 16px;
      height: 16px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      font-size: 0.94rem;
    }

    .breadcrumbs span.sep {
      color: var(--ink-faint);
      font-size: 0.8rem;
    }

    .breadcrumbs button {
      background: none;
      border: none;
      color: var(--ink-dim);
      font-weight: 600;
      font-size: 0.94rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 7px;
    }

    .breadcrumbs button:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }

    .breadcrumbs button.actual {
      color: var(--ink);
      font-weight: 700;
    }

    .breadcrumbs button.actual:hover {
      background: none;
    }

    .breadcrumbs button.zona-destino {
      background: var(--accent-dim);
      color: var(--accent-ink);
      outline: 2px dashed var(--accent);
    }

    /* --- Barra de selección --- */
    .barra-seleccion {
      display: none;
      align-items: center;
      gap: 14px;
      background: var(--accent-dim);
      border: 1px solid #c7d0ff;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--accent-ink);
    }

    .barra-seleccion.activa {
      display: flex;
    }

    .barra-seleccion .acciones {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .barra-seleccion button {
      background: var(--surface);
      border: 1px solid #c7d0ff;
      color: var(--accent-ink);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .barra-seleccion button.borrar {
      color: var(--danger);
      border-color: #f3c7bd;
    }

    .barra-seleccion button:hover {
      filter: brightness(0.97);
    }

    /* --- Zona de drop --- */
    .zona-drop {
      border: 2px dashed transparent;
      border-radius: 12px;
      transition: border-color .15s, background .15s;
      min-height: 200px;
    }

    .zona-drop.hover {
      border-color: var(--accent);
      background: rgba(61, 90, 254, 0.04);
    }

    /* --- Vista cuadrícula --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
      gap: 14px;
    }

    .item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: border-color .12s, box-shadow .12s;
      user-select: none;
    }

    .item:hover {
      box-shadow: var(--shadow-sm);
      border-color: #d3d8e6;
    }

    .item.seleccionado {
      border-color: var(--accent);
      background: var(--surface-selected);
    }

    .item.arrastrando {
      opacity: 0.4;
    }

    .item.carpeta.zona-destino {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .item .check {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      opacity: 0;
      transition: opacity .12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item:hover .check,
    .item.seleccionado .check {
      opacity: 1;
    }

    .item.seleccionado .check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item.seleccionado .check svg {
      width: 12px;
      height: 12px;
      color: #fff;
    }

    .item .icono {
      font-size: 2.1rem;
      margin: 6px 0 8px;
      line-height: 1;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item.carpeta .icono {
      color: var(--folder);
    }

    .item.archivo .icono {
      color: var(--ink-faint);
    }

    .item .icono img {
      max-width: 100%;
      max-height: 46px;
      border-radius: 5px;
      object-fit: cover;
    }

    .item .nombre {
      font-size: 0.78rem;
      font-weight: 600;
      word-break: break-word;
      line-height: 1.3;
      color: var(--ink);
      max-height: 2.6em;
      overflow: hidden;
    }

    .item .meta {
      font-size: 0.68rem;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    .item .menu-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity .12s;
    }

    .item:hover .menu-btn {
      opacity: 1;
    }

    .item .menu-btn:hover {
      color: var(--ink);
      background: var(--surface-hover);
    }

    .item .menu {
      display: none;
      position: absolute;
      top: 28px;
      right: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      z-index: 5;
      min-width: 130px;
      text-align: left;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .item .menu.abierto {
      display: block;
    }

    .item .menu button {
      display: block;
      width: 100%;
      background: none;
      border: none;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
    }

    .item .menu button:hover {
      background: var(--surface-hover);
    }

    .item .menu button.borrar {
      color: var(--danger);
    }

    /* --- Vista lista --- */
    .lista {
      width: 100%;
      border-collapse: collapse;
    }

    .lista thead th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .lista tbody tr {
      cursor: pointer;
      transition: background .1s;
    }

    .lista tbody tr:hover {
      background: var(--surface-hover);
    }

    .lista tbody tr.seleccionado {
      background: var(--surface-selected);
    }

    .lista td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.84rem;
      vertical-align: middle;
    }

    .lista td.col-check {
      width: 34px;
    }

    .lista td.col-check .check {
      width: 17px;
      height: 17px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lista tr.seleccionado td.col-check .check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .lista tr.seleccionado td.col-check .check svg {
      width: 11px;
      height: 11px;
      color: #fff;
    }

    .lista td.col-nombre {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .lista td.col-nombre .icono-mini {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .lista td.col-nombre .icono-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .lista td.col-meta {
      color: var(--ink-faint);
      white-space: nowrap;
    }

    .lista td.col-acciones {
      text-align: right;
      white-space: nowrap;
    }

    .lista td.col-acciones button {
      background: none;
      border: 1px solid var(--border);
      color: var(--ink-dim);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 10px;
      margin-left: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .lista td.col-acciones button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lista td.col-acciones button.borrar:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .vacio {
      text-align: center;
      color: var(--ink-dim);
      font-size: 0.86rem;
      padding: 60px 20px;
    }

    .vacio .icono-grande {
      font-size: 2.4rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .vacio strong {
      color: var(--ink);
    }

    /* --- Subidas en curso --- */
    #subidas {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 40;
    }

    .subida-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 0.78rem;
      box-shadow: var(--shadow-md);
    }

    .subida-item .top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--ink-dim);
      gap: 8px;
    }

    .subida-item .top span.nombre {
      color: var(--ink);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subida-item .barra {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .subida-item .barra .relleno {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .15s;
    }

    .subida-item.completa .barra .relleno {
      background: var(--ok);
    }

    .subida-item.fallida .barra .relleno {
      background: var(--danger);
      width: 100%;
    }

    #accion-msg {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 40;
    }

    /* --- Modal --- */
    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 35, 0.5);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .modal-fondo.abierto {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 26px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-md);
    }

    .modal h2 {
      font-size: 1.05rem;
      margin: 0 0 4px;
      font-weight: 700;
    }

    .modal .acciones {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal .acciones button {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal .acciones .cancelar {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink-dim);
    }

    .modal .acciones .confirmar {
      background: var(--accent);
      border: 1.5px solid var(--accent);
      color: #fff;
    }

    @media (max-width:820px) {
      #vista-app.activo {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
      }

      .sidebar .logo {
        padding: 0 12px 0 0;
      }

      .btn-nuevo {
        margin-bottom: 0;
        width: auto;
        padding: 9px 14px;
      }

      .sidebar-footer {
        margin-top: 0;
        margin-left: auto;
        padding-top: 0;
        border-top: none;
      }

      .nav-item {
        display: none;
      }

      .main {
        padding: 16px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }
    }
  </style>
</head>

<body>

  <!-- ===== VISTA: AUTENTICACIÓN ===== -->
  <div id="vista-auth">
    <div class="auth-caja">
      <div class="auth-logo">
        <div class="marca"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M12 12l9-5M12 12v10M12 12L3 7" stroke="white" stroke-width="1.6" stroke-linejoin="round" />
          </svg></div>
        <span>Bóveda</span>
      </div>

      <div class="tabs">
        <button id="tab-login" class="activo" onclick="cambiarTab('login')">Iniciar sesión</button>
        <button id="tab-registro" onclick="cambiarTab('registro')">Crear cuenta</button>
      </div>

      <div class="panel" id="panel-login">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="vos@empresa.com">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••">
        <button class="principal" onclick="login()">Iniciar sesión</button>
        <div class="mensaje" id="login-msg"></div>
      </div>

      <div class="panel" id="panel-registro" style="display:none;">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="vos@empresa.com">
        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" placeholder="mínimo 6 caracteres">
        <div class="fila">
          <div>
            <label for="reg-empresa">Empresa nueva</label>
            <input type="text" id="reg-empresa" placeholder="Mi Empresa">
          </div>
          <div>
            <label for="reg-codigo">O código de invitación</label>
            <input type="text" id="reg-codigo" placeholder="A3F9K2">
          </div>
        </div>
        <button class="principal" onclick="registrar()">Crear cuenta</button>
        <div class="mensaje" id="reg-msg"></div>
        <div class="codigo-caja" id="reg-codigo-caja" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ===== VISTA: APP (tipo Drive) ===== -->
  <div id="vista-app">
    <aside class="sidebar">
      <div class="logo">
        <div class="marca"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M12 12l9-5M12 12v10M12 12L3 7" stroke="white" stroke-width="1.6" stroke-linejoin="round" />
          </svg></div>
        <span>Bóveda</span>
      </div>

      <div style="position:relative;">
        <button class="btn-nuevo" onclick="event.stopPropagation(); toggleMenuNuevo()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          Nuevo
        </button>
        <div class="menu-nuevo" id="menu-nuevo">
          <button onclick="abrirModalCarpeta()">📁 Carpeta nueva</button>
          <button onclick="document.getElementById('input-archivo').click()">⬆ Subir archivos</button>
        </div>
      </div>
      <input type="file" id="input-archivo" multiple style="display:none;" onchange="subirVarios(this.files)">

      <div class="nav-item activo">🏠 Mi bóveda</div>

      <div class="uso-almacenamiento">
        <div class="barra-uso">
          <div class="relleno" id="relleno-uso" style="width:0%;"></div>
        </div>
        <div class="texto-uso" id="texto-uso">Calculando uso...</div>
      </div>

      <div class="sidebar-footer">
        <div class="cuenta">
          <div class="avatar" id="avatar-inicial"></div>
          <div class="email" id="email-usuario"></div>
          <button onclick="cerrarSesion()" title="Cerrar sesión">Salir</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="breadcrumbs" id="breadcrumbs"></div>

      <div class="topbar">
        <div class="buscador-wrap">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input type="text" id="buscador" placeholder="Buscar en esta carpeta..." oninput="renderizarItems()">
        </div>
        <div class="toggle-vista">
          <button id="btn-vista-grid" onclick="cambiarVista('grid')" title="Vista de cuadrícula">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" />
              <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" />
              <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" />
              <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button id="btn-vista-lista" onclick="cambiarVista('lista')" title="Vista de lista">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <div class="barra-seleccion" id="barra-seleccion">
        <span id="texto-seleccion">0 seleccionados</span>
        <div class="acciones">
          <button onclick="descargarSeleccionados()">Descargar</button>
          <button class="borrar" onclick="eliminarSeleccionados()">Eliminar</button>
          <button onclick="limpiarSeleccion()">Cancelar</button>
        </div>
      </div>

      <div class="zona-drop" id="zona-drop">
        <div class="grid" id="grid-items"></div>
        <table class="lista" id="tabla-items" style="display:none;">
          <thead>
            <tr>
              <th class="col-check"></th>
              <th>Nombre</th>
              <th>Tamaño</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-items-body"></tbody>
        </table>
        <div class="vacio" id="vacio-msg" style="display:none;"></div>
      </div>
    </main>
  </div>

  <div id="subidas"></div>
  <div class="mensaje" id="accion-msg"></div>

  <!-- Modal: nueva carpeta -->
  <div class="modal-fondo" id="modal-carpeta">
    <div class="modal">
      <h2>Nueva carpeta</h2>
      <label for="input-nombre-carpeta">Nombre</label>
      <input type="text" id="input-nombre-carpeta" placeholder="Ej: Fotos 2026"
        onkeydown="if(event.key==='Enter') crearCarpeta()">
      <div class="acciones">
        <button class="cancelar" onclick="cerrarModalCarpeta()">Cancelar</button>
        <button class="confirmar" onclick="crearCarpeta()">Crear</button>
      </div>
    </div>
  </div>

  <script>
    // ======= CONFIGURACIÓN =======
    const API_BASE = 'http://localhost:3000';

    let token = sessionStorage.getItem('boveda_token');
    let usuarioEmail = sessionStorage.getItem('boveda_email');
    let rutaActual = '';
    let itemsActuales = [];
    let vistaActual = localStorage.getItem('boveda_vista') || 'grid';
    let seleccion = new Set(); // guarda "tipo::nombre"

    const ICONO_CHECK = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    function cambiarTab(cual) {
      document.getElementById('tab-login').classList.toggle('activo', cual === 'login');
      document.getElementById('tab-registro').classList.toggle('activo', cual === 'registro');
      document.getElementById('panel-login').style.display = cual === 'login' ? 'block' : 'none';
      document.getElementById('panel-registro').style.display = cual === 'registro' ? 'block' : 'none';
    }

    function mostrarMensaje(id, texto, tipo) {
      const el = document.getElementById(id);
      el.textContent = texto;
      el.className = 'mensaje ' + tipo;
      if (tipo === 'ok') setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // ===== Registro / login =====
    async function registrar() {
      const email = document.getElementById('reg-email').value.trim();
      const contrasena = document.getElementById('reg-pass').value;
      const nombre_empresa = document.getElementById('reg-empresa').value.trim();
      const codigo_invitacion = document.getElementById('reg-codigo').value.trim();

      if (!email || !contrasena) { mostrarMensaje('reg-msg', 'Falta email o contraseña.', 'error'); return; }
      if (!nombre_empresa && !codigo_invitacion) { mostrarMensaje('reg-msg', 'Completá "empresa nueva" o "código de invitación".', 'error'); return; }

      try {
        const body = { email, contrasena };
        if (nombre_empresa) body.nombre_empresa = nombre_empresa;
        if (codigo_invitacion) body.codigo_invitacion = codigo_invitacion;

        const res = await fetch(`${API_BASE}/registro`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) { mostrarMensaje('reg-msg', data.error || 'No se pudo registrar.', 'error'); return; }

        mostrarMensaje('reg-msg', `Cuenta creada como ${data.rol}. Ya podés iniciar sesión.`, 'ok');
        const cajaCodigo = document.getElementById('reg-codigo-caja');
        if (data.codigo_invitacion) {
          cajaCodigo.style.display = 'block';
          cajaCodigo.textContent = `Código de invitación: ${data.codigo_invitacion}`;
        } else cajaCodigo.style.display = 'none';
      } catch (err) {
        mostrarMensaje('reg-msg', 'No se pudo conectar con el servidor. ¿Está corriendo en ' + API_BASE + '?', 'error');
      }
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const contrasena = document.getElementById('login-pass').value;
      if (!email || !contrasena) { mostrarMensaje('login-msg', 'Falta email o contraseña.', 'error'); return; }

      try {
        const res = await fetch(`${API_BASE}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, contrasena }) });
        const data = await res.json();
        if (!res.ok) { mostrarMensaje('login-msg', data.error || 'Credenciales inválidas.', 'error'); return; }

        token = data.token;
        usuarioEmail = email;
        sessionStorage.setItem('boveda_token', token);
        sessionStorage.setItem('boveda_email', email);
        entrarAApp();
      } catch (err) {
        mostrarMensaje('login-msg', 'No se pudo conectar con el servidor. ¿Está corriendo en ' + API_BASE + '?', 'error');
      }
    }

    function cerrarSesion() {
      token = null; usuarioEmail = null; rutaActual = ''; seleccion.clear();
      sessionStorage.removeItem('boveda_token');
      sessionStorage.removeItem('boveda_email');
      document.getElementById('vista-app').classList.remove('activo');
      document.getElementById('vista-auth').style.display = 'flex';
      document.getElementById('login-pass').value = '';
    }

    function entrarAApp() {
      document.getElementById('vista-auth').style.display = 'none';
      document.getElementById('vista-app').classList.add('activo');
      document.getElementById('email-usuario').textContent = usuarioEmail;
      document.getElementById('avatar-inicial').textContent = usuarioEmail.charAt(0).toUpperCase();
      aplicarVista();
      navegarA('');
      cargarUso();
    }

    if (token && usuarioEmail) entrarAApp();

    // ===== Menú "Nuevo" =====
    function toggleMenuNuevo() { document.getElementById('menu-nuevo').classList.toggle('abierto'); }
    document.addEventListener('click', () => document.getElementById('menu-nuevo').classList.remove('abierto'));

    // ===== Toggle vista grid/lista =====
    function cambiarVista(v) {
      vistaActual = v;
      localStorage.setItem('boveda_vista', v);
      aplicarVista();
      renderizarItems();
    }
    function aplicarVista() {
      document.getElementById('btn-vista-grid').classList.toggle('activo', vistaActual === 'grid');
      document.getElementById('btn-vista-lista').classList.toggle('activo', vistaActual === 'lista');
      document.getElementById('grid-items').style.display = vistaActual === 'grid' ? 'grid' : 'none';
      document.getElementById('tabla-items').style.display = vistaActual === 'lista' ? 'table' : 'none';
    }

    // ===== Helpers de red =====
    async function peticionAutenticada(ruta, opciones = {}) {
      const res = await fetch(`${API_BASE}${ruta}`, { ...opciones, headers: { ...(opciones.headers || {}), 'Authorization': `Bearer ${token}` } });
      if (res.status === 401) { cerrarSesion(); throw new Error('Sesión expirada. Iniciá sesión de nuevo.'); }
      return res;
    }

    function formatearTamano(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ===== Uso de almacenamiento de la empresa =====
    async function cargarUso() {
      try {
        const res = await peticionAutenticada('/uso');
        const data = await res.json();
        if (!res.ok) return;

        const relleno = document.getElementById('relleno-uso');
        const texto = document.getElementById('texto-uso');
        relleno.style.width = data.porcentaje + '%';
        relleno.classList.toggle('alerta', data.porcentaje >= 90);
        texto.textContent = `${formatearTamano(data.usadoBytes)} de ${formatearTamano(data.limiteBytes)} usados`;
      } catch (err) { /* si falla, no rompemos la app por esto */ }
    }

    function iconoPorExtension(nombre) {
      const ext = nombre.split('.').pop().toLowerCase();
      const mapa = {
        pdf: '📕', doc: '📄', docx: '📄', txt: '📄', md: '📄',
        xls: '📊', xlsx: '📊', csv: '📊', ppt: '📙', pptx: '📙',
        jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
        mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬', mp3: '🎵', wav: '🎵',
        zip: '🗜️', rar: '🗜️', '7z': '🗜️',
      };
      return mapa[ext] || '📦';
    }

    // ===== Navegación de carpetas =====
    function navegarA(ruta) {
      rutaActual = ruta;
      seleccion.clear();
      document.getElementById('buscador').value = '';
      cargarCarpeta();
    }

    function renderBreadcrumbs() {
      const cont = document.getElementById('breadcrumbs');
      const partes = rutaActual ? rutaActual.split('/') : [];
      let html = `<button class="${partes.length === 0 ? 'actual' : ''}" data-ruta-destino="" onclick="navegarA('')">Mi bóveda</button>`;
      let acumulado = '';
      partes.forEach((parte, i) => {
        acumulado += (i > 0 ? '/' : '') + parte;
        const esUltimo = i === partes.length - 1;
        html += `<span class="sep">/</span><button class="${esUltimo ? 'actual' : ''}" data-ruta-destino="${acumulado.replace(/"/g, '&quot;')}" onclick="navegarA('${acumulado.replace(/'/g, "\\'")}')">${parte}</button>`;
      });
      cont.innerHTML = html;

      cont.querySelectorAll('button[data-ruta-destino]').forEach(btn => {
        btn.addEventListener('dragover', e => { e.preventDefault(); btn.classList.add('zona-destino'); });
        btn.addEventListener('dragleave', () => btn.classList.remove('zona-destino'));
        btn.addEventListener('drop', e => {
          e.preventDefault();
          btn.classList.remove('zona-destino');
          const datos = e.dataTransfer.getData('text/plain');
          if (datos) moverItem(JSON.parse(datos), btn.dataset.rutaDestino);
        });
      });
    }

    async function cargarCarpeta() {
      renderBreadcrumbs();
      try {
        const res = await peticionAutenticada(`/archivos?ruta=${encodeURIComponent(rutaActual)}`);
        const data = await res.json();
        if (!res.ok) { mostrarMensaje('accion-msg', data.error || 'No se pudo cargar la carpeta.', 'error'); return; }
        itemsActuales = data.items || [];
        renderizarItems();
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    function claveItem(it) { return it.tipo + '::' + it.nombre; }

    function renderizarItems() {
      const filtro = document.getElementById('buscador').value.trim().toLowerCase();
      const items = itemsActuales.filter(it => !filtro || it.nombre.toLowerCase().includes(filtro));

      const vacio = document.getElementById('vacio-msg');
      if (items.length === 0) {
        document.getElementById('grid-items').innerHTML = '';
        document.getElementById('tabla-items-body').innerHTML = '';
        vacio.style.display = 'block';
        vacio.innerHTML = filtro
          ? `<div class="icono-grande">🔍</div>Nada coincide con "<strong>${filtro}</strong>".`
          : `<div class="icono-grande">📭</div>Esta carpeta está vacía.<br>Arrastrá archivos acá o usá el botón <strong>Nuevo</strong>.`;
      } else {
        vacio.style.display = 'none';
        if (vistaActual === 'grid') renderizarGrid(items); else renderizarLista(items);
      }

      actualizarBarraSeleccion();
    }

    function renderizarGrid(items) {
      const grid = document.getElementById('grid-items');
      grid.innerHTML = items.map((it, idx) => {
        const nombreEscapado = it.nombre.replace(/'/g, "\\'");
        const dataItem = encodeURIComponent(JSON.stringify({ tipo: it.tipo, nombre: it.nombre }));
        const clave = claveItem(it);
        const sel = seleccion.has(clave) ? 'seleccionado' : '';

        if (it.tipo === 'carpeta') {
          return `
          <div class="item carpeta ${sel}" draggable="true" data-item="${dataItem}" data-clave="${clave}"
               onclick="clicItem(event, '${clave}')" ondblclick="navegarA('${escaparRuta(rutaActual, it.nombre).replace(/'/g, "\\'")}')">
            <div class="check" onclick="event.stopPropagation(); toggleSeleccion('${clave}')">${ICONO_CHECK}</div>
            <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu(${idx})">⋮</button>
            <div class="menu" id="menu-${idx}">
              <button onclick="event.stopPropagation(); navegarA('${escaparRuta(rutaActual, it.nombre).replace(/'/g, "\\'")}')">Abrir</button>
              <button class="borrar" onclick="event.stopPropagation(); eliminarCarpeta('${nombreEscapado}')">Eliminar</button>
            </div>
            <div class="icono">📁</div>
            <div class="nombre">${it.nombre}</div>
          </div>`;
        }
        return `
        <div class="item archivo ${sel}" draggable="true" data-item="${dataItem}" data-clave="${clave}"
             onclick="clicItem(event, '${clave}')" ondblclick="descargarArchivo('${nombreEscapado}')">
          <div class="check" onclick="event.stopPropagation(); toggleSeleccion('${clave}')">${ICONO_CHECK}</div>
          <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu(${idx})">⋮</button>
          <div class="menu" id="menu-${idx}">
            <button onclick="event.stopPropagation(); descargarArchivo('${nombreEscapado}')">Descargar</button>
            <button class="borrar" onclick="event.stopPropagation(); eliminarArchivo('${nombreEscapado}')">Eliminar</button>
          </div>
          <div class="icono" data-nombre="${it.nombre.replace(/"/g, '&quot;')}">${iconoPorExtension(it.nombre)}</div>
          <div class="nombre">${it.nombre}</div>
          <div class="meta">${formatearTamano(it.tamanoBytes)}</div>
        </div>`;
      }).join('');

      activarDragAndDrop();
      cargarMiniaturas();
    }

    function renderizarLista(items) {
      const tbody = document.getElementById('tabla-items-body');
      tbody.innerHTML = items.map((it, idx) => {
        const nombreEscapado = it.nombre.replace(/'/g, "\\'");
        const dataItem = encodeURIComponent(JSON.stringify({ tipo: it.tipo, nombre: it.nombre }));
        const clave = claveItem(it);
        const sel = seleccion.has(clave) ? 'seleccionado' : '';
        const icono = it.tipo === 'carpeta' ? '📁' : iconoPorExtension(it.nombre);
        const dobleClick = it.tipo === 'carpeta'
          ? `navegarA('${escaparRuta(rutaActual, it.nombre).replace(/'/g, "\\'")}')`
          : `descargarArchivo('${nombreEscapado}')`;
        const accionesFila = it.tipo === 'carpeta'
          ? `<button onclick="event.stopPropagation(); navegarA('${escaparRuta(rutaActual, it.nombre).replace(/'/g, "\\'")}')">Abrir</button><button class="borrar" onclick="event.stopPropagation(); eliminarCarpeta('${nombreEscapado}')">Eliminar</button>`
          : `<button onclick="event.stopPropagation(); descargarArchivo('${nombreEscapado}')">Descargar</button><button class="borrar" onclick="event.stopPropagation(); eliminarArchivo('${nombreEscapado}')">Eliminar</button>`;

        return `
        <tr class="${it.tipo} ${sel}" draggable="true" data-item="${dataItem}" data-clave="${clave}"
            onclick="clicItem(event, '${clave}')" ondblclick="${dobleClick}">
          <td class="col-check"><div class="check" onclick="event.stopPropagation(); toggleSeleccion('${clave}')">${ICONO_CHECK}</div></td>
          <td class="col-nombre"><span class="icono-mini" data-nombre="${it.nombre.replace(/"/g, '&quot;')}">${icono}</span>${it.nombre}</td>
          <td class="col-meta">${it.tipo === 'archivo' ? formatearTamano(it.tamanoBytes) : '—'}</td>
          <td class="col-acciones">${accionesFila}</td>
        </tr>`;
      }).join('');

      activarDragAndDrop();
      cargarMiniaturas();
    }

    function escaparRuta(base, nombre) { return (base ? base + '/' : '') + nombre; }

    function toggleMenu(idx) {
      document.querySelectorAll('.menu.abierto').forEach(m => { if (m.id !== `menu-${idx}`) m.classList.remove('abierto'); });
      document.getElementById(`menu-${idx}`).classList.toggle('abierto');
    }
    document.addEventListener('click', () => document.querySelectorAll('.menu.abierto').forEach(m => m.classList.remove('abierto')));

    // ===== Selección múltiple =====
    function clicItem(e, clave) {
      // Evita que el clic en el ícono de check dispare dos veces
      toggleSeleccion(clave);
    }

    function toggleSeleccion(clave) {
      if (seleccion.has(clave)) seleccion.delete(clave); else seleccion.add(clave);
      renderizarItems();
    }

    function limpiarSeleccion() { seleccion.clear(); renderizarItems(); }

    function actualizarBarraSeleccion() {
      const barra = document.getElementById('barra-seleccion');
      const texto = document.getElementById('texto-seleccion');
      if (seleccion.size > 0) {
        barra.classList.add('activa');
        texto.textContent = `${seleccion.size} seleccionado${seleccion.size > 1 ? 's' : ''}`;
      } else {
        barra.classList.remove('activa');
      }
    }

    function itemsSeleccionados() {
      return itemsActuales.filter(it => seleccion.has(claveItem(it)));
    }

    async function descargarSeleccionados() {
      for (const it of itemsSeleccionados()) {
        if (it.tipo === 'archivo') await descargarArchivo(it.nombre);
      }
    }

    async function eliminarSeleccionados() {
      const items = itemsSeleccionados();
      if (items.length === 0) return;
      if (!confirm(`¿Eliminar ${items.length} elemento(s) seleccionados? Esta acción no se puede deshacer.`)) return;

      for (const it of items) {
        try {
          if (it.tipo === 'carpeta') {
            const rutaCompleta = escaparRuta(rutaActual, it.nombre);
            await peticionAutenticada(`/carpetas?ruta=${encodeURIComponent(rutaCompleta)}`, { method: 'DELETE' });
          } else {
            await peticionAutenticada(`/archivos/${encodeURIComponent(it.nombre)}?ruta=${encodeURIComponent(rutaActual)}`, { method: 'DELETE' });
          }
        } catch (err) { /* seguimos con el resto aunque uno falle */ }
      }
      seleccion.clear();
      cargarCarpeta();
      cargarUso();
    }

    // ===== Carpetas: crear / eliminar =====
    function abrirModalCarpeta() {
      document.getElementById('modal-carpeta').classList.add('abierto');
      document.getElementById('input-nombre-carpeta').value = '';
      document.getElementById('input-nombre-carpeta').focus();
    }
    function cerrarModalCarpeta() { document.getElementById('modal-carpeta').classList.remove('abierto'); }

    async function crearCarpeta() {
      const nombre = document.getElementById('input-nombre-carpeta').value.trim();
      if (!nombre) return;
      try {
        const res = await peticionAutenticada(`/carpetas?ruta=${encodeURIComponent(rutaActual)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre })
        });
        const data = await res.json();
        if (!res.ok) { mostrarMensaje('accion-msg', data.error || 'No se pudo crear la carpeta.', 'error'); return; }
        cerrarModalCarpeta();
        cargarCarpeta();
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    async function eliminarCarpeta(nombre) {
      if (!confirm(`¿Eliminar la carpeta "${nombre}" y todo su contenido? Esta acción no se puede deshacer.`)) return;
      try {
        const rutaCompleta = escaparRuta(rutaActual, nombre);
        const res = await peticionAutenticada(`/carpetas?ruta=${encodeURIComponent(rutaCompleta)}`, { method: 'DELETE' });
        if (res.ok) { cargarCarpeta(); cargarUso(); }
        else mostrarMensaje('accion-msg', 'No se pudo eliminar la carpeta.', 'error');
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    // ===== Archivos: subir / descargar / eliminar =====
    function subirVarios(lista) { Array.from(lista).forEach(archivo => subirUnArchivo(archivo)); }

    function subirUnArchivo(archivo) {
      const cont = document.getElementById('subidas');
      const div = document.createElement('div');
      div.className = 'subida-item';
      div.innerHTML = `<div class="top"><span class="nombre">${archivo.name}</span><span class="pct">0%</span></div><div class="barra"><div class="relleno"></div></div>`;
      cont.prepend(div);

      const relleno = div.querySelector('.relleno');
      const pct = div.querySelector('.pct');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${API_BASE}/subir?nombre=${encodeURIComponent(archivo.name)}&ruta=${encodeURIComponent(rutaActual)}`);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round((e.loaded / e.total) * 100);
          relleno.style.width = p + '%'; pct.textContent = p + '%';
        }
      };
      xhr.onload = () => {
        if (xhr.status === 201) {
          div.classList.add('completa'); pct.textContent = 'Listo';
          cargarCarpeta();
          cargarUso();
          setTimeout(() => div.remove(), 2200);
        } else if (xhr.status === 401) { cerrarSesion(); }
        else if (xhr.status === 413) {
          div.classList.add('fallida');
          try {
            const data = JSON.parse(xhr.responseText);
            pct.textContent = 'Sin espacio';
            mostrarMensaje('accion-msg', data.error || 'No hay espacio suficiente en tu empresa.', 'error');
          } catch (e) { pct.textContent = 'Sin espacio'; }
        }
        else { div.classList.add('fallida'); pct.textContent = 'Error'; }
      };
      xhr.onerror = () => { div.classList.add('fallida'); pct.textContent = 'Sin conexión'; };
      xhr.send(archivo);
    }

    async function descargarArchivo(nombre) {
      try {
        const res = await peticionAutenticada(`/descargar/${encodeURIComponent(nombre)}?ruta=${encodeURIComponent(rutaActual)}`);
        if (!res.ok) { mostrarMensaje('accion-msg', 'No se pudo descargar el archivo.', 'error'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nombre; a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    async function eliminarArchivo(nombre) {
      if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;
      try {
        const res = await peticionAutenticada(`/archivos/${encodeURIComponent(nombre)}?ruta=${encodeURIComponent(rutaActual)}`, { method: 'DELETE' });
        if (res.ok) { cargarCarpeta(); cargarUso(); }
        else mostrarMensaje('accion-msg', 'No se pudo eliminar el archivo.', 'error');
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    // ===== Arrastrar y soltar para mover =====
    function activarDragAndDrop() {
      document.querySelectorAll('[data-item]').forEach(el => {
        el.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', decodeURIComponent(el.dataset.item));
          el.classList.add('arrastrando');
        });
        el.addEventListener('dragend', () => el.classList.remove('arrastrando'));

        if (el.classList.contains('carpeta')) {
          el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('zona-destino'); });
          el.addEventListener('dragleave', () => el.classList.remove('zona-destino'));
          el.addEventListener('drop', e => {
            e.preventDefault();
            el.classList.remove('zona-destino');
            const datos = e.dataTransfer.getData('text/plain');
            if (!datos) return;
            const item = JSON.parse(datos);
            const nombreCarpetaDestino = JSON.parse(decodeURIComponent(el.dataset.item)).nombre;
            if (item.tipo === 'carpeta' && item.nombre === nombreCarpetaDestino) return;
            moverItem(item, escaparRuta(rutaActual, nombreCarpetaDestino));
          });
        }
      });
    }

    async function moverItem(item, destinoRuta) {
      try {
        const res = await peticionAutenticada('/mover', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo: item.tipo, nombre: item.nombre, origenRuta: rutaActual, destinoRuta })
        });
        const data = await res.json();
        if (!res.ok) { mostrarMensaje('accion-msg', data.error || 'No se pudo mover.', 'error'); return; }
        cargarCarpeta();
      } catch (err) {
        mostrarMensaje('accion-msg', err.message, 'error');
      }
    }

    // ===== Miniaturas reales para imágenes =====
    const cacheMiniaturas = {};
    const EXTENSIONES_IMAGEN = ['jpg', 'jpeg', 'png', 'gif', 'webp'];

    async function cargarMiniaturas() {
      const nodos = document.querySelectorAll('[data-nombre]');
      for (const el of nodos) {
        const nombre = el.dataset.nombre;
        const ext = nombre.split('.').pop().toLowerCase();
        if (!EXTENSIONES_IMAGEN.includes(ext)) continue;

        const clave = rutaActual + '/' + nombre;
        if (cacheMiniaturas[clave]) { el.innerHTML = `<img src="${cacheMiniaturas[clave]}" alt="">`; continue; }

        try {
          const res = await peticionAutenticada(`/descargar/${encodeURIComponent(nombre)}?ruta=${encodeURIComponent(rutaActual)}`);
          if (!res.ok) continue;
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          cacheMiniaturas[clave] = url;
          el.innerHTML = `<img src="${url}" alt="">`;
        } catch (err) { /* se queda con el emoji */ }
      }
    }

    // ===== Drag & drop desde fuera del navegador (subir archivos) =====
    const zonaDrop = document.getElementById('zona-drop');
    ['dragenter', 'dragover'].forEach(evt => zonaDrop.addEventListener(evt, e => {
      // Solo activar el estado "hover" de subida si lo que se arrastra
      // viene de FUERA (archivos del sistema), no si es un ítem interno
      // que estamos moviendo entre carpetas.
      if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); zonaDrop.classList.add('hover'); }
    }));
    ['dragleave', 'drop'].forEach(evt => zonaDrop.addEventListener(evt, e => { e.preventDefault(); zonaDrop.classList.remove('hover'); }));
    zonaDrop.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) subirVarios(e.dataTransfer.files);
    });
  </script>

</body>

</html>
